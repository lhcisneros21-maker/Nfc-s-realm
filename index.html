<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="theme-color" content="#fdefef">
<title>Heladería Italia 1609</title>
<style>
:root{--bg:#0a0b0c;--ac:#66f8ff;--tile:#17353a;--feat:#8a3f66;--onac:#101516;--cream:#f6f0e7;--mut:#b9b7b3;--line:#ffffff22}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#66f8ff1c,#0000 26rem),var(--bg);color:var(--cream);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,a,input,select,textarea{font:inherit}
.shell{max-width:490px;margin:auto;padding:20px 16px 48px}
.brand{text-align:center;padding:14px 0 12px}
.logo{width:140px;height:140px;margin:0 auto 14px;border-radius:24px;overflow:hidden;border:1px solid #ffffff28;box-shadow:0 16px 40px #0009;background:#0a0b0b;display:grid;place-items:center}
.logo img{width:100%;height:100%;object-fit:contain}.logo.em{font-size:3rem}
.kick{color:var(--ac);font-size:.7rem;font-weight:800;letter-spacing:.24em;text-transform:uppercase}
h1{font-size:1.65rem;line-height:1.1;letter-spacing:.03em;margin:8px 0 5px}
.tag{color:var(--mut);font-size:.9rem;margin:0}
.sw{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:16px 0}
.sw button{border:1px solid var(--line);background:#1c1e20;color:var(--mut);padding:12px 8px;border-radius:14px;font-weight:800;cursor:pointer}
.sw button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.panel{background:linear-gradient(180deg,#222526,#191b1c);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 18px 45px #0005}
.ov{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:#ef9fbd;font-weight:800}
h2{font-size:1.25rem;margin:6px 0}
.intro{font-size:.88rem;line-height:1.5;color:var(--mut);margin:0 0 16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:112px;padding:14px;border-radius:16px;background:var(--tile);border:1px solid #ffffff14;color:#fff;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .15s,filter .15s}
.tile:active{transform:scale(.97)}.tile:hover{filter:brightness(1.12)}
.ico{font-size:1.45rem}.tt{display:flex;flex-direction:column;gap:3px}
.tile strong{font-size:.92rem;line-height:1.2}.tile small{font-size:.72rem;opacity:.8;line-height:1.3}
.tile.feat{grid-column:1/-1;min-height:76px;flex-direction:row;align-items:center;background:var(--feat)}
.foot{text-align:center;color:#777;font-size:.7rem;margin-top:18px}
.empty{color:var(--mut);font-size:.88rem;text-align:center;padding:20px 0}
.fab{position:fixed;right:12px;bottom:12px;background:var(--ac);color:var(--onac);padding:10px 14px;border-radius:99px;font-weight:800;font-size:.8rem;text-decoration:none;box-shadow:0 6px 20px #000a}
.logo.fl{width:auto;height:250px;border:0;background:none;box-shadow:none;border-radius:0;overflow:visible;margin-bottom:0;position:relative;z-index:2}
.logo.fl img{height:250px;width:auto;max-width:none;object-fit:initial;filter:drop-shadow(0 18px 22px #000d);animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){.logo.fl img{animation:none}}
.brand.lg{padding-bottom:0}.panel.lg{margin-top:-46px;padding-top:62px}
.outro{margin-top:16px;padding:16px;border-radius:16px;background:#ffffff08;border:1px solid var(--line)}
.rh{color:var(--ac);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;margin:16px 0 6px;font-weight:800}.outro .rh:first-child{margin-top:0}
.rp{line-height:1.6;color:#e6e0d6;margin:8px 0;font-size:.92rem}
.rl{list-style:none;padding:0;margin:8px 0}.rl li{position:relative;padding:10px 12px 10px 38px;margin:7px 0;background:#ffffff0a;border-radius:12px;line-height:1.45;font-size:.9rem}
.rl li:before{content:"✓";position:absolute;left:12px;top:10px;color:var(--onac);background:var(--ac);width:18px;height:18px;border-radius:50%;font-size:.7rem;display:grid;place-items:center;font-weight:900}
.kv{padding:11px 0;border-bottom:1px solid var(--line)}.kv small{display:block;color:var(--ac);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin-bottom:3px}.kv div{line-height:1.45;word-break:break-word}
.kv a,.rp a{color:#fff;text-decoration:underline;text-decoration-color:var(--ac);text-underline-offset:3px}
.co{margin:12px 0;padding:13px 14px;border-left:4px solid var(--ac);background:#ffffff0d;border-radius:0 12px 12px 0;font-size:.88rem;line-height:1.5}
.st{display:flex;gap:12px;margin:10px 0;padding:13px;background:#ffffff0a;border-radius:14px}.st i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac);color:var(--onac);font-style:normal;font-weight:900;display:grid;place-items:center}.st b{display:block;margin-bottom:3px}.st span{font-size:.86rem;line-height:1.5;color:#d8d2c8}
.sh{position:sticky;top:0;background:#1a1c1d;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0 10px;z-index:1}.sh h2{margin:0;font-size:1.12rem;line-height:1.25}
.sh button{flex:none;width:36px;height:36px;border-radius:50%;background:#2a2d30;color:var(--cream);border:1px solid var(--line);cursor:pointer;font-size:1rem}
.grab{width:42px;height:4px;border-radius:9px;background:#ffffff33;margin:10px auto 0}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.spin{position:fixed;inset:0;z-index:0;display:grid;place-items:center;perspective:1100px;pointer-events:none;overflow:hidden}
.spin[hidden]{display:none}
.rot{height:min(86vh,740px);aspect-ratio:308/720;position:relative;transform-style:preserve-3d;animation:turn 18s linear infinite;will-change:transform;opacity:.55}
.rot img{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:drop-shadow(0 0 28px #66f8ff55)}
.rot img+img{transform:rotateY(180deg)}
@keyframes turn{to{transform:rotateY(360deg)}}
@media(prefers-reduced-motion:reduce){.rot{animation:none}}
.shell{position:relative;z-index:1}
.panel{background:linear-gradient(180deg,#232728b8,#191b1cb8)!important;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.panel h2:after{content:"";display:block;width:56px;height:4px;border-radius:9px;margin-top:9px;background:linear-gradient(90deg,#f4a6c6,#66f8ff,#a99be0)}
.tile{background:linear-gradient(150deg,var(--tile),#0e1c1e);border:1px solid #66f8ff2e}
.tile.feat{background:linear-gradient(150deg,var(--feat),#4a2038);border-color:#f4a6c64d}
h1,h2,.ov,.kick,.sw button{text-transform:uppercase;letter-spacing:.07em}
.tile strong{letter-spacing:.02em}
/* hoja de contenido */
.sheet{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet[hidden]{display:none}
.sheet .in{width:100%;max-width:490px;max-height:88vh;overflow:auto;background:#1a1c1d;border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;padding:0 18px 36px;animation:up .25s ease-out}
.back{background:#1c1e20;color:var(--cream);border:1px solid var(--line);border-radius:99px;padding:9px 14px;cursor:pointer;font-weight:700}
.sheet h2{margin:18px 0 10px;font-size:1.4rem}
.sheet h3{color:var(--ac);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;margin:22px 0 4px}
.it{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.it small{display:block;color:var(--mut);font-size:.78rem;margin-top:2px}.it span{font-weight:800;white-space:nowrap}
.card{background:#1d2022;border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}
.card p{margin:4px 0 0;color:var(--mut);font-size:.88rem;line-height:1.45}
.gal img{width:100%;border-radius:14px;margin-bottom:10px;display:block}
.txt{white-space:pre-wrap;line-height:1.6;color:#e6e0d6}
.lnk{display:block;padding:14px;margin:8px 0;background:var(--tile);border-radius:14px;color:#fff;text-decoration:none;font-weight:700}
/* admin */
.adm h1{font-size:1.35rem;letter-spacing:0}
details{background:#1b1d1f;border:1px solid var(--line);border-radius:16px;margin:10px 0;padding:0 14px}
summary{padding:14px 0;font-weight:800;cursor:pointer;color:var(--ac)}
details>div{padding-bottom:14px}
label{display:block;font-size:.72rem;color:var(--mut);margin-top:9px}
input:not([type=checkbox]):not([type=color]),textarea,select{width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0e0f10;color:var(--cream);font-size:.9rem}
input[type=color]{width:100%;height:42px;margin-top:4px;border:1px solid var(--line);border-radius:10px;background:#0e0f10;padding:3px}
.ck{display:inline-flex;align-items:center;gap:7px;margin:8px 14px 0 0;font-size:.82rem;color:var(--cream)}
.ck input{width:18px;height:18px;accent-color:var(--ac)}
.adm button{background:#2a2d30;color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin:8px 8px 0 0;cursor:pointer;font-weight:700;font-size:.82rem}
.adm button.p{background:var(--ac);color:var(--onac);border-color:var(--ac)}.adm button.d{color:#ff9d9d}
.prev a{display:inline-block;margin:6px 8px 0 0;padding:9px 13px;border-radius:99px;background:#2a2d30;color:var(--cream);text-decoration:none;font-size:.82rem;font-weight:700}
.hint{font-size:.76rem;color:var(--mut);line-height:1.5;margin:8px 0 0}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.thumbs div{position:relative}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.thumbs button{position:absolute;top:4px;right:4px;margin:0!important;padding:4px 8px!important}
/* ---- paleta blanca ---- */
:root{--bg:#fff;--cream:#1b2427;--mut:#5c676b;--line:#0000001a;--acd:#078893;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:radial-gradient(ellipse at 50% 0,#66f8ff30,#0000 26rem),var(--bg)}
.panel{background:linear-gradient(180deg,#ffffffdb,#f4f9f9db)!important;box-shadow:0 14px 38px #0a2a2f24;border-color:#0000001a}
.ov{color:#cc4f86}.kick,.rh,.kv small,.sheet h3,.sep h3{color:var(--acd)}.foot{color:#8a9498}
.sw button{background:#fff;color:var(--mut);box-shadow:0 2px 8px #0001}.logo.em{background:#eef4f4}
.sheet{background:#0a1a1c8c}.sheet .in{background:#fff;border-color:#0000001a}.sh{background:#fff}
.sh button,.back{background:#eef2f2;color:#1b2427}.grab{background:#0003}
.it small{color:var(--mut)}.card{background:#f3f8f8}.rp{color:#2c383c}
.rl li,.st{background:#0a9aa512}.st span{color:#46535a}.co{background:#66f8ff26;color:#1b2427}
.kv a,.rp a,.co a{color:#0a6f78;text-decoration-color:var(--ac)}
.outro{background:#ffffffb8;border-color:#0000001a}
.rot{opacity:.62}.rot img{filter:drop-shadow(0 0 16px #66f8ff40)}
.sep{grid-column:1/-1}.sep h3{margin:18px 0 6px;font-size:1rem;letter-spacing:.12em;text-transform:uppercase}
.sep h3:after{content:"";display:block;width:56px;height:4px;border-radius:9px;margin-top:8px;background:linear-gradient(90deg,#f4a6c6,#66f8ff,#a99be0)}
.sep p{color:var(--mut);font-size:.88rem;line-height:1.55;margin:0 0 4px}.sep .outro{margin:10px 0 0}
details{background:#fff}summary{color:var(--acd)}
input:not([type=checkbox]):not([type=color]),textarea,select,input[type=color]{background:#fff;border-color:#0003;color:#1b2427}
.adm button,.prev a{background:#eef2f2;color:#1b2427;border-color:#0002}.adm button.p{background:var(--ac);color:var(--onac)}.adm button.d{color:#c0392b}
/* ---- botones con los colores del cono ---- */
:root{--c0:#eea340;--c1:#fd97cf;--c2:#8ef0ee;--c3:#c3b0f5;--ink:#17171a}
.tile{background:var(--c0);color:var(--ink);border:3px solid var(--ink);box-shadow:0 6px 14px #0002,inset 0 2px 0 #ffffff66}
.tile.c1,.lnk:nth-of-type(4n+2){background:var(--c1)}.tile.c2,.lnk:nth-of-type(4n+3){background:var(--c2)}.tile.c3,.lnk:nth-of-type(4n){background:var(--c3)}
.tile.feat{background:var(--c1);border-color:var(--ink)}.tile.feat.c0{background:var(--c0)}.tile.feat.c2{background:var(--c2)}.tile.feat.c3{background:var(--c3)}
.tile small{opacity:.78}.tile strong{font-weight:800}
.lnk{background:var(--c0);color:var(--ink);border:3px solid var(--ink);font-weight:800}
.sw button.on{background:var(--c2);color:var(--ink);border:2px solid var(--ink)}
.sw{position:relative;z-index:3}.sw button{font-size:.7rem;letter-spacing:.04em;padding:11px 6px}.sw+.panel.lg{margin-top:12px;padding-top:18px}
/* ---- paleta Minimal Italiano (698C · 621C · 7443C · 468C · Black C) ---- */
:root{--bg:#fdefef;--c0:#eccfaf;--c1:#f9d6d5;--c2:#cae6db;--c3:#d5c5ec;--ink:#23221e;--cream:#23221e;--acd:#23221e;--mut:#5f5a55;--line:#23221e1f}
body{background:radial-gradient(ellipse at 50% 0,#ffffffcc,#0000 28rem),#fdefef}
.tile,.lnk{border:3px solid var(--ink);box-shadow:0 5px 12px #23221e1f,inset 0 2px 0 #ffffff80}
.tile small{opacity:.72}
.ov{color:#a8456b}
.kick,.rh,.kv small,.sheet h3,.sep h3{color:#23221e}
.panel h2:after,.sep h3:after{background:linear-gradient(90deg,#f4a9b8,#9fd8c2,#b9a2e6)}
.panel{background:linear-gradient(180deg,#ffffffe6,#fff8f8e6)!important;border-color:#23221e1a;box-shadow:0 14px 38px #23221e1f}
.sw button{background:#fff;border:2px solid #23221e33}.sw button.on{background:var(--c2);color:var(--ink);border:2px solid var(--ink)}
.rl li,.st{background:#f9d6d559}.rl li:before{background:var(--c2);color:var(--ink);border:1.5px solid var(--ink)}
.st i{background:var(--c3);color:var(--ink);border:1.5px solid var(--ink)}
.co{background:#cae6db66;border-left-color:var(--ink);color:var(--ink)}
.kv a,.rp a,.co a{color:var(--ink);text-decoration-color:#9fd8c2}
.outro{background:#ffffffd0;border-color:#23221e1a}
.sheet{background:#23221e80}.sheet .in{background:#fff}.sh{background:#fff}.sh button,.back{background:#f9d6d5;color:var(--ink);border:1.5px solid var(--ink)}
.card{background:#fdefef}
.rot img{filter:drop-shadow(0 0 16px #f4a9b855)}
.adm button.p{background:var(--c2);color:var(--ink);border:2px solid var(--ink)}
summary{color:#23221e}
.tile.feat{background:var(--c1)}.tile.feat.c0{background:var(--c0)}.tile.feat.c2{background:var(--c2)}.tile.feat.c3{background:var(--c3)}
</style>
</head>

nados serán contactados para coordinar la documentación, formalización de su contrato e incorporación al equipo."}, {"id": "t4", "on": true, "feat": true, "icon": "💡", "title": "Información importante", "sub": "Antes de postular", "type": "page", "t": "- El envío del CV no garantiza una entrevista ni una contratación.\n- Los antecedentes serán considerados según las vacantes y necesidades de la empresa.\n- Nos comunicaremos directamente con los candidatos que avancen en el proceso.\n- No es necesario acudir presencialmente para entregar el CV, salvo que nuestro equipo lo solicite."}], "nfc": [{"id": "n1", "label": "NFC 1 · Clientes", "over": "Bienvenido", "title": "Todo Italia 1609 en un solo lugar", "intro": "Explora nuestras cartas, conoce el local y encuentra nuestras redes y reseñas.", "outro": "", "buttons": ["b1", "b2", "b3", "b4", "b5"]}, {"id": "n2", "label": "NFC 2 · Proveedores", "over": "Proveedores", "title": "¡Gracias por tu interés en trabajar con nosotros!", "intro": "En Heladería Italia 1609 valoramos las oportunidades de establecer nuevas alianzas comerciales con proveedores que compartan nuestro compromiso con la calidad, la innovación y la excelencia.\nSi deseas ofrecernos tus productos o servicios, te invitamos a enviarnos tu propuesta comercial para que nuestro equipo pueda evaluarla.", "outro": "## ¡Construyamos nuevas oportunidades!\nAgradecemos tu interés en formar parte de nuestra red de proveedores. Creemos en las relaciones comerciales basadas en la confianza, la calidad y el crecimiento mutuo.\n> Calidad, innovación y buenas alianzas.", "buttons": ["p1", "p2", "p3", "p4", "p5", "b3"]}, {"id": "n3", "label": "NFC 3 · Trabaja con nosotros", "over": "Trabaja con nosotros", "title": "¡Queremos conocer tu talento!", "intro": "En Heladería Italia 1609 estamos siempre interesados en conocer personas responsables, comprometidas, proactivas y apasionadas por la atención al cliente y el mundo gastronómico.\nSi te gustaría formar parte de nuestro eq function theme(){const c=S.colors,r=document.documentElement.style;r.setProperty('--bg',c.bg);r.setProperty('--ac',c.accent);r.setProperty('--tile',c.tile);r.setProperty('--feat',c.feature);r.setProperty('--onac',lum(c.accent)>.55?'#101516':'#fff');document.title=S.brand.name;const sp=$('#spin'),B=S.brand;if(B.spinOn&&B.spin){if(!sp.firstChild)sp.innerHTML=`<div class="rot"><img src="${B.spin}" alt=""><img src="${B.spin}" alt=""></div>`;sp.hidden=false}else sp.hidden=true}
const isAdm=()=>{try{return sessionStorage.getItem('adm')}catch(e){}};

function route(){closeSheet();const h=location.hash.slice(1);if(h==='admin')return admin();view(S.nfc.find(n=>n.id===h)||S.nfc[0])}
function tile(b,k){if(b.type==='sep')return`<div class="sep">${b.title?`<h3>${esc(b.title)}</h3>`:''}${b.sub?`<p>${esc(b.sub).replace(/\n/g,'<br><br>')}</p>`:''}${b.t?`<div class="outro">${rich(b.t)}</div>`:''}</div>`;const ext=b.type==='link'&&b.t;return`<a class="tile c${(k||0)%4}${b.feat?' feat':''}" data-b="${b.id}" href="${ext?esc(b.t):'#'}"${ext?' target="_blank" rel="noopener"':''}><span class="ico">${esc(b.icon)}</span><span class="tt"><strong>${esc(b.title)}</strong><small>${esc(b.sub)}</small></span></a>`}
function view(n){theme();const B=S.brand;
 const bs=n.buttons.map(id=>S.buttons.find(b=>b.id===id)).filter(b=>b&&b.on);
 $('#app').className='shell';
 $('#app').innerHTML=`<header class="brand${B.logo?' lg':''}">${B.logo?`<div class="logo fl"><img src="${B.logo}" alt="${esc(B.name)}"></div>`:`<div class="logo em">${esc(B.emoji)}</div>`}${!B.logo||B.showName?`<div class="kick">${esc(B.kicker)}</div><h1>${esc(B.name)}</h1>`:''}${B.logo?'':`<p class="tag">${esc(B.tagline)}</p>`}</header>
 ${S.switcher?`<nav class="sw">${S.nfc.map(x=>`<button data-go="${x.id}" class="${x.id===n.id?'on':''}">${esc(x.label)}</button>`).join('')}</nav>`:''}
 <section class="panel${B.logo?' lg':''}"><div class="ov">${esc(n.over)}</div><h2>${esc(n.title)}</h2><p class="intro">${esc(n.intro).replace(/\n/g,'<br><br>')}</p>
 ${bs.length?`<div class="tiles">${(()=>{let k=0,col=0;return bs.map((b,i)=>{let w=b.feat;if(!w&&i===bs.length-1&&col===0)w=true;col=w?0:(col+1)%2;return tile(w===b.feat?b:Object.assign({},b,{feat:true}),k++)}).join('')})()}</div>`:'<div class="empty">Sin botones visibles</div>'}</section>${n.outro?`<div class="outro">${rich(n.outro)}</div>`:''}
 <div class="foot">${B.logo?esc(B.tagline):esc(B.name)}</div>${isAdm()?'<a class="fab" href="#admin">⚙ Panel</a>':''}`}

const lk=t=>esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/([\w.+-]+@[\w-]+\.[\w.]+)/g,'<a href="mailto:$1">$1</a>').replace(/(\+56 ?9[\d ]{8,10}\d)/g,(m)=>'<a href="https://wa.me/'+m.replace(/\D/g,'')+'" target="_blank" rel="noopener">'+m+'</a>');
function rich(t){let o='',ul=false;const cl=()=>{if(ul){o+='</ul>';ul=false}};
 L(t).forEach(l=>{let m;
  if(m=l.match(/^- (.+)/)){if(!ul){o+='<ul class="rl">';ul=true}o+='<li>'+lk(m[1])+'</li>';return}cl();
  if(m=l.match(/^## (.+)/))o+='<div class="rh">'+esc(m[1])+'</div>';
  else if(m=l.match(/^> (.+)/))o+='<div class="co">'+lk(m[1])+'</div>';
  else if(m=l.match(/^(\d)\) ([^|]+)\|(.+)/))o+='<div class="st"><i>'+m[1]+'</i><div><b>'+esc(m[2].trim())+'</b><span>'+esc(m[3].trim())+'</span></div></div>';
  else if(m=l.match(/^(.+?) :: (.+)/))o+='<div class="kv"><small>'+esc(m[1])+'</small><div>'+lk(m[2])+'</div></div>';
  else o+='<p class="rp">'+lk(l)+'</p>'});cl();return o}
function openB(b){
 if(b.type==='link'){if(!b.t)alert('Este enlace aún no está configurado.');return}
 let h='';
 if(b.type==='menu'){const m=S.menus.find(x=>x.id===b.t);h=m?`<h2>${esc(m.name)}</h2>`+L(m.text).map(l=>{const[a,p,d]=l.split('|').map(s=>s.trim());return p===undefined?`<h3>${esc(a)}</h3>`:`<div class="it"><div><b>${esc(a)}</b>${d?`<small>${esc(d)}</small>`:''}</div><span>${esc(p)}</span></div>`}).join(''):'<div class="empty">Carta no disponible</div>'}
 else if(b.type==='promos'){h=`<h2>${esc(b.title)}</h2>`+(L(S.promos).map(l=>{const[a,d]=l.split('|').map(s=>s.trim());return`<div class="card"><b>${esc(a)}</b>${d?`<p>${esc(d)}</p>`:''}</div>`}).join('')||'<div class="empty">Pronto habrá novedades</div>')}
 else if(b.type==='socials'){h=`<h2>${esc(b.title)}</h2>`+L(S.socials).map(l=>{const[a,u]=l.split('|').map(s=>s.trim());return`<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener">${esc(a)} ↗</a>`}).join('')}
 else if(b.type==='photos'){h=`<h2>${esc(b.title)}</h2><div class="gal">${S.photos.map(p=>`<img src="${p}" alt="">`).join('')||'<div class="empty">Sin fotos todavía</div>'}</div>`}
 else{h=rich(b.t)}
 const s=$('#sheet');s.innerHTML=`<div class="in"><div class="grab"></div><div class="sh"><h2>${esc(b.icon)} ${esc(b.title)}</h2><button data-act="close" aria-label="Cerrar">✕</button></div>${h.replace(/<h2>.*?<\/h2>/,'')}</div>`;s.hidden=false}
function closeSheet(){$('#sheet').hidden=true}

/* ---------- PANEL DE ADMINISTRACIÓN ---------- */
const O=new Set(['0']);
const f=(l,p,v,t='text')=>`<label>${l}<input type="${t}" data-p="${p}" value="${esc(v)}"></label>`;
const ta=(l,p,v,r=5)=>`<label>${l}<textarea rows="${r}" data-p="${p}">${esc(v)}</textarea></label>`;
const ck=(l,p,v,x='')=>`<label class="ck"><input type="checkbox" data-p="${p}" data-c ${x} ${v?'checked':''}> ${l}</label>`;
const TY={sep:'Título de sección o texto (no es botón)',link:'Abrir un enlace',menu:'Mostrar carta / precios',promos:'Mostrar promociones',socials:'Mostrar redes sociales',photos:'Mostrar galería de fotos',page:'Mostrar página de texto'};
const PRE=[['Menta','#66f8ff','#17353a','#8a3f66','#ffffff'],['Cálido','#ffb35c','#6b3a1d','#8a3f50','#ffffff'],['Océano','#7bbcff','#1d3a5c','#3b2f63','#ffffff']];
function admin(){theme();try{sessionStorage.setItem('adm',1)}catch(e){}
 const B=S.brand,C=S.colors;
 const secs=[
 ['Marca y logotipo',f('Nombre del establecimiento','brand.name',B.name)+f('Texto superior','brand.kicker',B.kicker)+f('Frase','brand.tagline',B.tagline)+f('Emoji (se usa si no hay logotipo)','brand.emoji',B.emoji)+ck('Mostrar nombre en texto bajo el logo','brand.showName',B.showName)+ck('Helado giratorio de fondo','brand.spinOn',B.spinOn,'data-r')+`<label>Logotipo<input type="file" accept="image/*" data-logo></label>${B.logo?'<button data-act="nologo" class="d">Quitar logotipo</button>':''}`],
 ['Colores',[['accent','Color de acento'],['bg','Fondo']].map(([k,l])=>f(l,'colors.'+k,C[k],'color')).join('')+'<div class="hint">Estilos rápidos:</div>'+PRE.map((p,i)=>`<button data-pre="${i}">${p[0]}</button>`).join('')],
 ['Botones visibles',S.buttons.map((b,i)=>`<div class="card">${ck('Visible',`buttons.${i}.on`,b.on)}${ck('Destacado (ancho completo)',`buttons.${i}.feat`,b.feat)}
 ${f('Ícono','buttons.'+i+'.icon',b.icon)}${f('Título','buttons.'+i+'.title',b.title)}${f('Subtítulo','buttons.'+i+'.sub',b.sub)}
 <label>Qué hace<select data-p="buttons.${i}.type" data-r>${Object.entries(TY).map(([k,v])=>`<option value="${k}"${k===b.type?' selected':''}>${v}</option>`).join('')}</select></label>
 ${b.type==='link'?f('Dirección (URL)',`buttons.${i}.t`,b.t,'url'):(b.type==='page'||b.type==='sep')?ta('Contenido del pop up',`buttons.${i}.t`,b.t,8)+'<div class="hint">Formato: <b>- viñeta</b> · <b>Etiqueta :: valor</b> · <b>&gt; nota destacada</b> · <b>## subtítulo</b> · <b>1) Título | texto</b> (paso). Los enlaces, correos y WhatsApp se vuelven pulsables.</div>':b.type==='menu'?`<label>Carta<select data-p="buttons.${i}.t">${S.menus.map(m=>`<option value="${m.id}"${m.id===b.t?' selected':''}>${esc(m.name)}</option>`).join('')}</select></label>`:''}
 <button class="d" data-del="buttons.${i}">Eliminar botón</button></div>`).join('')+'<button class="p" data-add="b">+ Agregar botón</button>'],
 ['Cartas y precios',S.menus.map((m,i)=>`<div class="card">${f('Nombre de la carta','menus.'+i+'.name',m.name)}${ta('Productos','menus.'+i+'.text',m.text,9)}<button class="d" data-del="menus.${i}">Eliminar carta</button></div>`).join('')+'<div class="hint">Una línea por producto: <b>Nombre | Precio | Descripción</b>. Una línea sin “|” es un título de sección.</div><button class="p" data-add="m">+ Agregar carta</button>'],
 ['Redes sociales',ta('Una por línea: Nombre | enlace','socials',S.socials,5)],
 ['Promociones',ta('Una por línea: Título | detalle','promos',S.promos,5)+'<div class="hint">Recuerda activar el botón “Promociones” en Botones visibles.</div>'],
 ['Fotografías',`<label>Agregar fotos<input type="file" accept="image/*" multiple data-photos></label><div class="thumbs">${S.photos.map((p,i)=>`<div><img src="${p}" alt=""><button class="d" data-ph="${i}">✕</button></div>`).join('')}</div><div class="hint">Se reducen automáticamente. Recuerda activar el botón “Galería”.</div>`],
 ['Accesos NFC (cantidad y función)',`<div class="hint">Cada NFC abre una versión distinta. Elige qué botones muestra cada uno.</div>`+S.nfc.map((n,i)=>`<div class="card">${f('Nombre interno','nfc.'+i+'.label',n.label)}${f('Etiqueta pequeña','nfc.'+i+'.over',n.over)}${f('Título','nfc.'+i+'.title',n.title)}${ta('Introducción','nfc.'+i+'.intro',n.intro,4)}${ta('Texto de cierre (opcional)','nfc.'+i+'.outro',n.outro||'',4)}
 <label>Botones que muestra</label>${S.buttons.map(b=>`<label class="ck"><input type="checkbox" data-nb="${i}|${b.id}" ${n.buttons.includes(b.id)?'checked':''}> ${esc(b.title||'Texto de sección')}</label>`).join('')}
 <label>Dirección para grabar en este NFC<input readonly onclick="this.select()" value="${esc(S.baseUrl+'#'+n.id)}"></label>
 ${S.nfc.length>1?`<button class="d" data-del="nfc.${i}">Eliminar NFC</button>`:''}</div>`).join('')+'<button class="p" data-add="n">+ Agregar NFC</button>'],
 ['Publicar',f('Dirección base donde se publicará (GitHub Pages)','baseUrl',S.baseUrl,'url')+ck('Mostrar selector entre accesos a los visitantes','switcher',S.switcher,'data-c')+`<div class="hint">Tus cambios se guardan solo en este dispositivo. Para que los vean los clientes, descarga el archivo y súbelo a GitHub Pages como <b>index.html</b>.</div><button class="p" data-act="dl">⬇ Descargar versión lista</button><button class="d" data-act="reset">Restablecer todo</button>`]
 ];
 $('#app').className='shell adm';
 $('#app').innerHTML=`<h1>Panel de administración</h1><p class="tag">Edita aquí, mira el resultado y descarga.</p><div class="prev">${S.nfc.map(n=>`<a href="#${n.id}">👁 ${esc(n.label)}</a>`).join('')}</div>`+secs.map((s,i)=>`<details data-i="${i}" ${O.has(String(i))?'open':''}><summary>${s[0]}</summary><div>${s[1]}</div></details>`).join('')}

/* ---------- eventos ---------- */
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.i!=null)d.open?O.add(d.dataset.i):O.delete(d.dataset.i)},true);
const onEdit=e=>{const t=e.target;
 if(t.dataset.p){let v=t.dataset.c!==undefined?t.checked:t.value;setP(t.dataset.p,v);if(t.dataset.r&&t.dataset.p.endsWith('.type'))setP(t.dataset.p.replace('.type','.t'),t.value==='menu'&&S.menus[0]?S.menus[0].id:'');save();theme();if(t.dataset.r)admin()}
 else if(t.dataset.nb){const[i,id]=t.dataset.nb.split('|'),a=S.nfc[i].buttons;const x=a.indexOf(id);t.checked?x<0&&a.push(id):x>=0&&a.splice(x,1);save()}
 else if(t.dataset.logo!==undefined&&t.files[0])img(t.files[0],500,'image/png').then(u=>{S.brand.logo=u;save();admin()});
 else if(t.dataset.photos!==undefined)Promise.all([...t.files].map(f=>img(f,900,'image/jpeg'))).then(a=>{S.photos.push(...a);save();admin()})};
document.addEventListener('input',e=>{if(e.target.type!=='file'&&e.target.tagName!=='SELECT'&&e.target.type!=='checkbox')onEdit(e)});
document.addEventListener('change',onEdit);
document.addEventListener('click',e=>{if(e.target.id==='sheet')return closeSheet();const t=e.target.closest('[data-b],[data-go],[data-act],[data-del],[data-add],[data-pre],[data-ph]');if(!t)return;const d=t.dataset;
 if(d.b){const b=S.buttons.find(x=>x.id===d.b);if(b.type!=='link'||!b.t){e.preventDefault();openB(b)}}
 else if(d.go)location.hash=d.go;
 else if(d.act==='close')closeSheet();
 else if(d.act==='nologo'){S.brand.logo='';save();admin()}
 else if(d.act==='reset'){if(confirm('¿Borrar los cambios de este dispositivo?')){localStorage.removeItem('tc1');S=D;admin()}}
 else if(d.act==='dl')dl();
 else if(d.pre){const p=PRE[d.pre];Object.assign(S.colors,{accent:p[1],tile:p[2],feature:p[3],bg:p[4]});save();admin()}
 else if(d.ph){S.photos.splice(d.ph,1);save();admin()}
 else if(d.del){const[k,i]=d.del.split('.');const[x]=S[k].splice(i,1);if(k==='buttons')S.nfc.forEach(n=>n.buttons=n.buttons.filter(b=>b!==x.id));save();admin()}
 else if(d.add){if(d.add==='b')S.buttons.push({id:uid('b'),on:true,feat:false,icon:'•',title:'Nuevo botón',sub:'Descripción',type:'link',t:''});
  if(d.add==='m')S.menus.push({id:uid('m'),name:'Nueva carta',text:'Sección\nProducto | $0 | Descripción'});
  if(d.add==='n')S.nfc.push({id:uid('n'),label:'NFC nuevo',over:'Bienvenido',title:'Título',intro:'Texto de introducción.',buttons:[]});
  save();O.add(String(d.add==='b'?2:d.add==='m'?3:7));admin()}});
addEventListener('hashchange',route);

function img(file,max,type){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL(type,.72))};i.src=r.result};r.readAsDataURL(file)})}
function dl(){const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#app').className='shell';c.querySelector('#sheet').innerHTML='';c.querySelector('#spin').innerHTML='';c.querySelector('#spin').hidden=true;c.querySelector('#sheet').hidden=true;
 c.querySelector('#cfg').textContent=JSON.stringify(S).replace(/</g,'\\u003c');c.removeAttribute('style');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!doctype html>\n'+c.outerHTML],{type:'text/html'}));a.download='index.html';a.click()}
route();
</script>
</body>
</html>
